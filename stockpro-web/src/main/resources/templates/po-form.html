<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ${activeMenu}, ~{::section})}">
<head>
    <title>PO Form | StockPro</title>
</head>
<body>
<section class="page-section">
    <th:block th:replace="~{fragments/components :: sectionHeader(${pageMode == 'edit'} ? 'Review Purchase Order' : 'Create Purchase Order','The web layer forwards this payload directly to purchase-service.', null, null)}"></th:block>

    <div class="flash flash--warning" th:if="${pageMode == 'edit'}">
        The current purchase-service API does not expose a PO update endpoint. This screen is rendered as a review form only.
    </div>

    <th:block th:replace="~{fragments/components :: formCard('PO Header','Supplier, warehouse, and line item payload.', ~{::poFormShell})}"></th:block>
    <form th:fragment="poFormShell"
          th:object="${poForm}"
          th:action="@{/purchase/orders/new}"
          method="post"
          class="entity-form"
          th:attrappend="${pageMode == 'edit'} ? 'data-loading=false' : 'data-loading=true'">
        <div class="form-grid form-grid--two">
            <label class="field">
                <span>Supplier</span>
                <select th:field="*{supplierId}" th:disabled="${pageMode == 'edit'}" required>
                    <option value="">Select supplier</option>
                    <option th:each="supplier : ${supplierOptions}" th:value="${supplier.supplierId}" th:text="${supplier.name}">Supplier</option>
                </select>
            </label>
            <label class="field">
                <span>Warehouse</span>
                <select th:field="*{warehouseId}" th:disabled="${pageMode == 'edit'}" required>
                    <option value="">Select warehouse</option>
                    <option th:each="warehouse : ${warehouseOptions}" th:value="${warehouse.warehouseId}" th:text="${warehouse.name}">Warehouse</option>
                </select>
            </label>
            <label class="field">
                <span>Created By ID</span>
                <input type="number" th:field="*{createdById}" th:readonly="${pageMode == 'edit'}">
            </label>
            <label class="field">
                <span>Expected Date</span>
                <input type="date" th:field="*{expectedDate}" th:readonly="${pageMode == 'edit'}">
            </label>
            <label class="field field--wide">
                <span>Reference Number</span>
                <input type="text" th:field="*{referenceNumber}" th:readonly="${pageMode == 'edit'}">
            </label>
            <label class="field field--wide">
                <span>Notes</span>
                <textarea th:field="*{notes}" rows="4" th:readonly="${pageMode == 'edit'}"></textarea>
            </label>
        </div>

        <section class="panel panel--filters">
            <div class="panel__header">
                <div>
                    <h2>Line Items</h2>
                    <p>Populate product IDs, quantity, and unit cost for each row.</p>
                </div>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Product ID</th>
                        <th>Quantity</th>
                        <th>Unit Cost</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line, stat : *{lineItems}">
                        <td><input type="number" th:field="*{lineItems[__${stat.index}__].productId}" th:readonly="${pageMode == 'edit'}"></td>
                        <td><input type="number" th:field="*{lineItems[__${stat.index}__].quantity}" th:readonly="${pageMode == 'edit'}"></td>
                        <td><input type="number" step="0.01" th:field="*{lineItems[__${stat.index}__].unitCost}" th:readonly="${pageMode == 'edit'}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <div class="form-actions" th:if="${pageMode != 'edit'}">
            <button type="submit" class="primary-button">Create Purchase Order</button>
            <a th:href="@{/purchase/orders}" class="ghost-button">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
