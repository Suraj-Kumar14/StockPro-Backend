<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ${activeMenu}, ~{::section})}">
<head>
    <title>Low Stock Report | StockPro</title>
</head>
<body>
<section class="page-section">
    <th:block th:replace="~{fragments/components :: sectionHeader('Low Stock Report','Highlight products below reorder level for replenishment planning.', null, null)}"></th:block>

    <th:block th:replace="~{fragments/components :: filterCard('Report Filters', ~{::reportFilters})}"></th:block>
    <form th:fragment="reportFilters" th:action="@{/inventory/reports/low-stock}" method="get" class="filter-form">
        <div class="filter-grid">
            <label class="field">
                <span>Warehouse</span>
                <select name="warehouseId">
                    <option value="">All Warehouses</option>
                    <option th:each="warehouse : ${warehouseOptions}" th:value="${warehouse.warehouseId}" th:text="${warehouse.name}"
                            th:selected="${filters.warehouseId == warehouse.warehouseId}">Warehouse</option>
                </select>
            </label>
            <label class="field">
                <span>Product</span>
                <select name="productId">
                    <option value="">All Products</option>
                    <option th:each="product : ${productOptions}" th:value="${product.productId}" th:text="${product.name}"
                            th:selected="${filters.productId == product.productId}">Product</option>
                </select>
            </label>
        </div>
        <div class="filter-actions">
            <button type="submit" class="primary-button">Apply Filters</button>
            <a th:href="@{/inventory/reports/low-stock}" class="ghost-button">Reset</a>
        </div>
    </form>

    <section class="panel">
        <div class="panel__header">
            <div>
                <h2>Critical Reorder Queue</h2>
                <p>Rows below reorder level are emphasized for planners.</p>
            </div>
        </div>
        <div class="table-wrap" th:if="${!reportPage.empty()}">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Warehouse</th>
                    <th>Available</th>
                    <th>Reorder Level</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${reportPage.items()}"
                    th:classappend="${row.availableQuantity < row.reorderLevel} ? ' table-row--critical' : ''">
                    <td th:text="${row.productName}">Product</td>
                    <td th:text="${row.warehouseId}">Warehouse</td>
                    <td th:text="${row.availableQuantity}">0</td>
                    <td th:text="${row.reorderLevel}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${reportPage.empty()}">
            <th:block th:replace="~{fragments/components :: emptyState('No low stock rows','The current filter set returned no low stock results.', null, null)}"></th:block>
        </div>
    </section>
    <div th:replace="~{fragments/components :: pagination(${reportPage})}"></div>
</section>
</body>
</html>
