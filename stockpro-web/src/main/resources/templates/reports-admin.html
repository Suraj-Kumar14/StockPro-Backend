<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ${activeMenu}, ~{::section})}">
<head>
    <title>Admin Reports | StockPro</title>
</head>
<body>
<section class="page-section">
    <th:block th:replace="~{fragments/components :: sectionHeader('Admin Reports','Cross-service valuation, turnover analytics, and export workflows.', 'Generate Report', @{/admin/reports/generate})}"></th:block>

    <div class="metric-grid">
        <article class="metric-card">
            <span class="metric-card__title">Total Stock Value</span>
            <strong class="metric-card__value" th:text="${#numbers.formatDecimal(totalStockValue.totalStockValue,1,'COMMA',2,'POINT')}">0.00</strong>
            <p class="metric-card__helper" th:text="${'Snapshot Date: ' + totalStockValue.snapshotDate}">Date</p>
        </article>
        <article class="metric-card">
            <span class="metric-card__title">Top Moving Rows</span>
            <strong class="metric-card__value" th:text="${topMovingPage.totalElements()}">0</strong>
            <a th:href="@{/admin/reports/top-moving}" class="metric-card__link">Open report</a>
        </article>
        <article class="metric-card">
            <span class="metric-card__title">Dead Stock Rows</span>
            <strong class="metric-card__value" th:text="${deadStockPage.totalElements()}">0</strong>
            <a th:href="@{/admin/reports/dead-stock}" class="metric-card__link">Open report</a>
        </article>
    </div>

    <section class="panel">
        <div class="panel__header">
            <div>
                <h2>Inventory Turnover</h2>
                <p>Turnover results for the current filter scope.</p>
            </div>
        </div>
        <div class="table-wrap" th:if="${!#lists.isEmpty(turnoverRows)}">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Turnover Rate</th>
                    <th>Window</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${turnoverRows}">
                    <td th:text="${row.productName}">Product</td>
                    <td th:text="${row.turnoverRate}">0</td>
                    <td th:text="${row.fromDate} + ' to ' + ${row.toDate}">Window</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${#lists.isEmpty(turnoverRows)}">
            <th:block th:replace="~{fragments/components :: emptyState('No turnover data','Submit a date window or scope to generate turnover output.', null, null)}"></th:block>
        </div>
    </section>
</section>
</body>
</html>
