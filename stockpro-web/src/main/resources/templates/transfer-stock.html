<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ${activeMenu}, ~{::section})}">
<head>
    <title>Transfer Stock | StockPro</title>
</head>
<body>
<section class="page-section">
    <th:block th:replace="~{fragments/components :: sectionHeader('Transfer Stock','Submit a warehouse-to-warehouse transfer without embedding allocation logic in the UI.', null, null)}"></th:block>

    <th:block th:replace="~{fragments/components :: formCard('Transfer Request','This form forwards directly to warehouse-service stock transfer endpoint.', ~{::transferFormShell})}"></th:block>
    <form th:fragment="transferFormShell" th:object="${transferForm}" th:action="@{/inventory/stock/transfer}" method="post"
          class="entity-form" data-loading="true">
        <div class="form-grid form-grid--two">
            <label class="field">
                <span>Source Warehouse</span>
                <select th:field="*{sourceWarehouseId}" required>
                    <option value="">Select source</option>
                    <option th:each="warehouse : ${warehouseOptions}" th:value="${warehouse.warehouseId}" th:text="${warehouse.name}">Warehouse</option>
                </select>
                <small class="field-error" th:errors="*{sourceWarehouseId}" th:if="${#fields.hasErrors('sourceWarehouseId')}">Error</small>
            </label>
            <label class="field">
                <span>Destination Warehouse</span>
                <select th:field="*{destinationWarehouseId}" required>
                    <option value="">Select destination</option>
                    <option th:each="warehouse : ${warehouseOptions}" th:value="${warehouse.warehouseId}" th:text="${warehouse.name}">Warehouse</option>
                </select>
            </label>
            <label class="field">
                <span>Product</span>
                <select th:field="*{productId}" required>
                    <option value="">Select product</option>
                    <option th:each="product : ${productOptions}" th:value="${product.productId}" th:text="${product.name}">Product</option>
                </select>
            </label>
            <label class="field">
                <span>Quantity</span>
                <input type="number" step="0.01" th:field="*{quantity}" required>
            </label>
            <label class="field">
                <span>Reference ID</span>
                <input type="number" th:field="*{referenceId}">
            </label>
            <label class="field">
                <span>Unit Cost</span>
                <input type="number" step="0.01" th:field="*{unitCost}">
            </label>
            <label class="field field--wide">
                <span>Notes</span>
                <textarea th:field="*{notes}" rows="4"></textarea>
            </label>
        </div>
        <div class="form-actions">
            <button type="submit" class="primary-button">Submit Transfer</button>
            <a th:href="@{/inventory/movements}" class="ghost-button">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
