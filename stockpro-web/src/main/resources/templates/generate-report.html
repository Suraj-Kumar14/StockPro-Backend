<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ${activeMenu}, ~{::section})}">
<head>
    <title>Generate Report | StockPro</title>
</head>
<body>
<section class="page-section">
    <th:block th:replace="~{fragments/components :: sectionHeader('Generate Inventory Report','Create export-ready analytical reports through report-service.', null, null)}"></th:block>

    <section class="panel">
        <div class="panel__header">
            <div>
                <h2>Report Export</h2>
                <p>Select report type, scope, date range, and output format.</p>
            </div>
        </div>
        <form th:object="${reportForm}" th:action="@{/admin/reports/generate}" method="post" class="entity-form" data-loading="true">
            <div class="form-grid form-grid--two">
                <label class="field">
                    <span>Report Type</span>
                    <select th:field="*{reportType}">
                        <option value="LOW_STOCK">LOW_STOCK</option>
                        <option value="TOP_MOVING">TOP_MOVING</option>
                        <option value="DEAD_STOCK">DEAD_STOCK</option>
                        <option value="TURNOVER">TURNOVER</option>
                        <option value="PO_SUMMARY">PO_SUMMARY</option>
                    </select>
                </label>
                <label class="field">
                    <span>Format</span>
                    <select th:field="*{format}">
                        <option value="CSV">CSV</option>
                        <option value="PDF">PDF</option>
                        <option value="EXCEL">EXCEL</option>
                    </select>
                </label>
                <label class="field">
                    <span>Warehouse</span>
                    <select th:field="*{warehouseId}">
                        <option value="">All Warehouses</option>
                        <option th:each="warehouse : ${warehouseOptions}" th:value="${warehouse.warehouseId}" th:text="${warehouse.name}">Warehouse</option>
                    </select>
                </label>
                <label class="field">
                    <span>Supplier</span>
                    <select th:field="*{supplierId}">
                        <option value="">All Suppliers</option>
                        <option th:each="supplier : ${supplierOptions}" th:value="${supplier.supplierId}" th:text="${supplier.name}">Supplier</option>
                    </select>
                </label>
                <label class="field">
                    <span>From Date</span>
                    <input type="date" th:field="*{fromDate}">
                </label>
                <label class="field">
                    <span>To Date</span>
                    <input type="date" th:field="*{toDate}">
                </label>
                <label class="field field--wide">
                    <span>Requested By</span>
                    <input type="email" th:field="*{requestedBy}" readonly>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="primary-button">Generate Report</button>
                <a th:href="@{/admin/reports}" class="ghost-button">Cancel</a>
            </div>
        </form>
    </section>
</section>
</body>
</html>
