<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, activeMenu, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">StockPro</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
    <header th:replace="~{layout/header :: header}"></header>
    <div class="app-main-shell">
        <aside th:replace="~{layout/sidebar :: sidebar(${activeMenu})}"></aside>
        <main class="app-main">
            <div th:replace="~{fragments/components :: flashMessages}"></div>
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>
    <footer th:replace="~{layout/footer :: footer}"></footer>
</div>
<div class="page-loader" hidden data-loader>
    <div class="page-loader__card">
        <span class="spinner"></span>
        <span>Loading workspace data...</span>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
