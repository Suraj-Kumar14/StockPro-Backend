server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:

        # ================= AUTH SERVICE =================
        - id: auth
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/auth/**

  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

# OPTIONAL
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}