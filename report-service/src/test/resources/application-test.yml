server:
  port: 0

app:
  jwt:
    secret: ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345

spring:
  application:
    name: REPORT-SERVICE

  datasource:
    url: jdbc:h2:mem:report_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

product:
  service:
    name: PRODUCT-SERVICE
    path: /products

warehouse:
  service:
    name: WAREHOUSE-SERVICE

movement:
  service:
    name: MOVEMENT-SERVICE
    path: /api/v1/movements

purchase:
  service:
    name: PURCHASE-SERVICE
    path: /api/v1/purchase-orders

eureka:
  client:
    enabled: false

management:
  health:
    rabbit:
      enabled: false

report:
  snapshot:
    cron: 0 0 0 * * *
    page-size: 50
  dead-stock:
    threshold-days: 90
  export:
    directory: target/test-report-exports
  rabbitmq:
    exchange: stockpro.report.exchange
    queues:
      snapshot-completed: report.snapshot.completed.queue
      generation-requested: report.generation.requested.queue
      generation-completed: report.generation.completed.queue
    routing-keys:
      snapshot-completed: report.snapshot.completed
      generation-requested: report.generation.requested
      generation-completed: report.generation.completed

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
