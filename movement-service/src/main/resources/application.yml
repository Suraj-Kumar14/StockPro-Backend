server:
  port: ${PORT:8086}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}

product:
  service:
    name: ${PRODUCT_SERVICE_NAME:PRODUCT-SERVICE}
    path: ${PRODUCT_SERVICE_PATH:/products}

movement:
  validation:
    product-enabled: ${MOVEMENT_VALIDATE_PRODUCT:true}

spring:
  application:
    name: MOVEMENT-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/stock_movement?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Suraj@123}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    com.stockpro.movement: ${LOG_LEVEL:INFO}