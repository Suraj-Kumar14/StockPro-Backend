server:
  port: 8086

spring:
  application:
    name: MOVEMENT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/movement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${MOVEMENT_DB_USERNAME}
    password: ${MOVEMENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    pathmatch:
      use-suffix-pattern: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.stockpro: DEBUG
  file:
    name: logs/movement-service.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET}

product-service:
  base-url: ${PRODUCT_SERVICE_BASE_URL}

warehouse-service:
  base-url: ${WAREHOUSE_SERVICE_BASE_URL}

stockpro:
  rabbitmq:
    movement:
      exchange: ${MOVEMENT_RABBITMQ_EXCHANGE:stockpro.movement.exchange}
      routing:
        created: movement.created
        reversed: movement.reversed
        stock-in: movement.stock-in
        stock-out: movement.stock-out
        transfer-in: movement.transfer-in
        transfer-out: movement.transfer-out
        adjusted: movement.adjusted
        write-off: movement.write-off
        returned: movement.returned
    stock:
      movement:
        queue: ${STOCK_MOVEMENT_QUEUE:stockpro.stock.movement.queue}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always
