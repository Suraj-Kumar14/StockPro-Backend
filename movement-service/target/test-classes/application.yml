app:
  jwt:
    secret: ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345

movement:
  validation:
    product-enabled: true

spring:
  application:
    name: MOVEMENT-SERVICE
  datasource:
    url: jdbc:h2:mem:movementservice;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
