server:
  port: ${PORT:8083}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}

product:
  service:
    name: ${PRODUCT_SERVICE_NAME:PRODUCT-SERVICE}
    path: ${PRODUCT_SERVICE_PATH:/products}

movement:
  service:
    name: ${MOVEMENT_SERVICE_NAME:MOVEMENT-SERVICE}
    path: ${MOVEMENT_SERVICE_PATH:/api/v1/movements}

warehouse:
  validation:
    product-enabled: ${WAREHOUSE_VALIDATE_PRODUCT:true}

alert:
  rabbitmq:
    exchange: ${ALERT_EXCHANGE:stockpro.alert.exchange}
    routing-keys:
      low-stock: ${LOW_STOCK_ROUTING_KEY:alert.low-stock}
      overstock: ${OVERSTOCK_ROUTING_KEY:alert.overstock}

spring:
  application:
    name: WAREHOUSE-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/warehouse_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Suraj@123}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:true}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    com.stockpro.warehouse: ${LOG_LEVEL:INFO}
