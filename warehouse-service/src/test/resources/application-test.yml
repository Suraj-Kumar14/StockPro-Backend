server:
  port: 0

app:
  jwt:
    secret: ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345

product:
  service:
    name: PRODUCT-SERVICE
    path: /products

movement:
  service:
    name: MOVEMENT-SERVICE
    path: /api/v1/movements

warehouse:
  validation:
    product-enabled: true

spring:
  application:
    name: WAREHOUSE-SERVICE

  datasource:
    url: jdbc:h2:mem:warehouse_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
