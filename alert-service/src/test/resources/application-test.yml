app:
  jwt:
    secret: ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345

spring:
  datasource:
    url: jdbc:h2:mem:alertservice;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

logging:
  level:
    com.stockpro.alert: WARN

management:
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    enabled: false
