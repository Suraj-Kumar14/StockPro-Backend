server:
  port: ${PORT:8087}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}

integration:
  service-token: ${INTEGRATION_SERVICE_TOKEN:}

auth:
  service:
    name: ${AUTH_SERVICE_NAME:AUTH-SERVICE}
    path: ${AUTH_SERVICE_PATH:/auth/user}

alert:
  email:
    lookup-enabled: ${ALERT_EMAIL_LOOKUP_ENABLED:true}
    from: ${ALERT_MAIL_FROM:${spring.mail.username:}}
  rabbitmq:
    exchange: ${ALERT_EXCHANGE:stockpro.alert.exchange}
    dlx: ${ALERT_DLX:stockpro.alert.dlx}
    dead-queue: ${ALERT_DEAD_QUEUE:stockpro.alert.dead.queue}
    dead-routing-key: ${ALERT_DEAD_ROUTING_KEY:alert.dead}
    routing-keys:
      low-stock: ${LOW_STOCK_ROUTING_KEY:alert.low-stock}
      overstock: ${OVERSTOCK_ROUTING_KEY:alert.overstock}
      po-pending: ${PO_PENDING_ROUTING_KEY:alert.po-pending}
      overdue-receipt: ${OVERDUE_RECEIPT_ROUTING_KEY:alert.overdue-receipt}
      system: ${SYSTEM_ALERT_ROUTING_KEY:alert.system}
      email: ${EMAIL_ALERT_ROUTING_KEY:alert.email}
    queues:
      low-stock: ${LOW_STOCK_QUEUE:stockpro.alert.low-stock.queue}
      overstock: ${OVERSTOCK_QUEUE:stockpro.alert.overstock.queue}
      po-pending: ${PO_PENDING_QUEUE:stockpro.alert.po-pending.queue}
      overdue-receipt: ${OVERDUE_RECEIPT_QUEUE:stockpro.alert.overdue-receipt.queue}
      system: ${SYSTEM_ALERT_QUEUE:stockpro.alert.system.queue}
      email: ${EMAIL_ALERT_QUEUE:stockpro.alert.email.queue}
    retry:
      max-attempts: ${ALERT_RABBIT_RETRY_MAX_ATTEMPTS:3}
      initial-interval: ${ALERT_RABBIT_RETRY_INITIAL_INTERVAL:1000}
      multiplier: ${ALERT_RABBIT_RETRY_MULTIPLIER:2.0}
      max-interval: ${ALERT_RABBIT_RETRY_MAX_INTERVAL:10000}

spring:
  application:
    name: ALERT-SERVICE

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/alert_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Suraj@123}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    dynamic: ${RABBIT_DYNAMIC:false}
    listener:
      simple:
        default-requeue-rejected: false
        auto-startup: ${RABBIT_LISTENER_AUTO_STARTUP:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha

logging:
  level:
    com.stockpro.alert: ${LOG_LEVEL:INFO}
