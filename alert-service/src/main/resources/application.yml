server:
  port: 8087

spring:
  application:
    name: ALERT-SERVICE

  datasource:
    url: ${ALERT_DB_URL:jdbc:mysql://localhost:3306/alert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ALERT_DB_USERNAME}
    password: ${ALERT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mvc:
    pathmatch:
      use-suffix-pattern: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.stockpro: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always

stockpro:
  alert:
    mail:
      enabled: ${ALERT_MAIL_ENABLED:false}
      from-address: ${ALERT_FROM_EMAIL:noreply@stockpro.local}
    expiry-cron: ${ALERT_EXPIRY_CRON:0 0/30 * * * *}
    overdue-critical-days: ${ALERT_OVERDUE_CRITICAL_DAYS:3}
  rabbitmq:
    alert:
      exchange: ${ALERT_RABBITMQ_EXCHANGE:stockpro.alert.exchange}
      events-queue: ${ALERT_EVENTS_QUEUE:stockpro.alert.events.queue}
      email-queue: ${ALERT_EMAIL_QUEUE:stockpro.alert.email.queue}
      audit-queue: ${ALERT_AUDIT_QUEUE:stockpro.alert.audit.queue}
      system:
        queue: ${ALERT_SYSTEM_QUEUE:stockpro.alert.system.queue}
        routing-key: ${ALERT_SYSTEM_ROUTING_KEY:alert.system.*}
    warehouse:
      exchange: ${WAREHOUSE_RABBITMQ_EXCHANGE:stockpro.warehouse.exchange}
      low:
        queue: ${ALERT_WAREHOUSE_LOW_QUEUE:stockpro.alert.warehouse.low-stock.queue}
        routing-key: ${WAREHOUSE_LOW_ROUTING_KEY:stock.low}
      overstock:
        queue: ${ALERT_WAREHOUSE_OVERSTOCK_QUEUE:stockpro.alert.warehouse.overstock.queue}
        routing-key: ${WAREHOUSE_OVERSTOCK_ROUTING_KEY:stock.overstock}
      activity:
        queue: ${ALERT_WAREHOUSE_ACTIVITY_QUEUE:stockpro.alert.warehouse.activity.queue}
        updated-routing-key: ${WAREHOUSE_UPDATED_ROUTING_KEY:stock.updated}
        transfer-initiated-routing-key: ${WAREHOUSE_TRANSFER_INITIATED_ROUTING_KEY:stock.transfer.initiated}
        transfer-completed-routing-key: ${WAREHOUSE_TRANSFER_COMPLETED_ROUTING_KEY:stock.transferred}
    purchase:
      exchange: ${PURCHASE_RABBITMQ_EXCHANGE:stockpro.purchase.exchange}
      created:
        routing-key: ${PURCHASE_CREATED_ROUTING_KEY:purchase.created}
      pending:
        queue: ${ALERT_PURCHASE_PENDING_QUEUE:stockpro.alert.purchase.pending-approval.queue}
        routing-key: ${PURCHASE_PENDING_ROUTING_KEY:purchase.pending-approval}
      submitted:
        routing-key: ${PURCHASE_SUBMITTED_ROUTING_KEY:purchase.submitted}
      approved:
        queue: ${ALERT_PURCHASE_APPROVED_QUEUE:stockpro.alert.purchase.approved.queue}
        routing-key: ${PURCHASE_APPROVED_ROUTING_KEY:purchase.approved}
      rejected:
        queue: ${ALERT_PURCHASE_REJECTED_QUEUE:stockpro.alert.purchase.rejected.queue}
        routing-key: ${PURCHASE_REJECTED_ROUTING_KEY:purchase.rejected}
      cancelled:
        routing-key: ${PURCHASE_CANCELLED_ROUTING_KEY:purchase.cancelled}
      received:
        queue: ${ALERT_PURCHASE_RECEIVED_QUEUE:stockpro.alert.purchase.received.queue}
        partial-routing-key: ${PURCHASE_PARTIALLY_RECEIVED_ROUTING_KEY:purchase.partially-received}
        full-routing-key: ${PURCHASE_FULLY_RECEIVED_ROUTING_KEY:purchase.fully-received}
      overdue:
        queue: ${ALERT_PURCHASE_OVERDUE_QUEUE:stockpro.alert.purchase.overdue.queue}
        routing-key: ${PURCHASE_OVERDUE_ROUTING_KEY:purchase.overdue}
      updated:
        routing-key: ${PURCHASE_UPDATED_ROUTING_KEY:purchase.updated}
    payment:
      exchange: ${PAYMENT_RABBITMQ_EXCHANGE:stockpro.payment.exchange}
      alert:
        queue: ${ALERT_PAYMENT_QUEUE:stockpro.alert.payment.queue}
        routing-key: ${PAYMENT_ALERT_ROUTING_KEY:payment.*}
    supplier:
      exchange: ${SUPPLIER_RABBIT_EXCHANGE:stockpro.supplier.exchange}
      alert:
        queue: ${ALERT_SUPPLIER_QUEUE:stockpro.alert.supplier.queue}
        deactivated-routing-key: ${SUPPLIER_DEACTIVATED_ROUTING_KEY:supplier.deactivated}
        blacklisted-routing-key: ${SUPPLIER_BLACKLISTED_ROUTING_KEY:supplier.blacklisted}
    movement:
      exchange: ${MOVEMENT_RABBITMQ_EXCHANGE:stockpro.movement.exchange}
      alert:
        queue: ${ALERT_MOVEMENT_QUEUE:stockpro.alert.movement.queue}
        routing-key: ${MOVEMENT_ALERT_ROUTING_KEY:movement.*}
    auth:
      exchange: ${AUTH_RABBITMQ_EXCHANGE:stockpro.auth.exchange}
      otp:
        queue: ${AUTH_OTP_QUEUE:stockpro.auth.otp.queue}
        routing-key: ${AUTH_OTP_ROUTING_KEY:auth.otp.send}
