server:
  port: 8761

spring:
  application:
    name: EUREKA-SERVER

eureka:
  client:
    register-with-eureka: false  
    fetch-registry: false        

  server:
    enable-self-preservation: false  

logging:
  level:
    root: INFO
    com.stockpro: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: WARN
