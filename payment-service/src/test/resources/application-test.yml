spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-jwt-secret-test-jwt-secret-test-jwt-secret

stockpro:
  rabbitmq:
    payment:
      exchange: stockpro.payment.exchange
      events-queue: stockpro.payment.events.queue
      report-queue: stockpro.payment.report.queue
      alert-queue: stockpro.payment.alert.queue
      purchase-queue: stockpro.payment.purchase.queue