server:
  port: 8082

spring:
  application:
    name: PRODUCT-SERVICE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    home-page-url: http://localhost:${server.port}/
    status-page-url: http://localhost:${server.port}/actuator/info
    health-check-url: http://localhost:${server.port}/actuator/health

logging:
  level:
    root: INFO
    com.stockpro: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

warehouse-service:
  base-url: ${WAREHOUSE_SERVICE_BASE_URL}

purchase-service:
  base-url: ${PURCHASE_SERVICE_BASE_URL}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL}

jwt:
  secret: ${JWT_SECRET}

stockpro:
  rabbitmq:
    product:
      exchange: ${PRODUCT_RABBITMQ_EXCHANGE:stockpro.product.exchange}
      routing:
        created: ${PRODUCT_RABBITMQ_ROUTING_CREATED:product.created}
        updated: ${PRODUCT_RABBITMQ_ROUTING_UPDATED:product.updated}
        activated: ${PRODUCT_RABBITMQ_ROUTING_ACTIVATED:product.activated}
        deactivated: ${PRODUCT_RABBITMQ_ROUTING_DEACTIVATED:product.deactivated}
        reorderChanged: ${PRODUCT_RABBITMQ_ROUTING_REORDER_CHANGED:product.reorder-config.changed}
        deleted: ${PRODUCT_RABBITMQ_ROUTING_DELETED:product.deleted}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans,mappings,threaddump,caches,scheduledtasks,configprops
  endpoint:
    health:
      show-details: always
    env:
      show-values: when_authorized
    configprops:
      show-values: when_authorized
  health:
    redis:
      enabled: false
