server:
  port: ${PORT:8081}
  address: 0.0.0.0

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

spring:
  application:
    name: AUTH-SERVICE

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:surajkr1122003@gmail.com}
    password: ${MAIL_PASSWORD:ubspxbkazkapsvgl}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

  datasource:
    url: jdbc:h2:mem:authservice
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:1062076986351-o4evbpnfki5ksk0mq2qn93infg31jle1.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: ${REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - email
              - profile

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:8080}
        instance:
          prefer-ip: true

springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha
