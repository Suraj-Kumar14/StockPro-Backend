server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: AUTH-SERVICE

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:surajkr1122003@gmail.com}
    password: ${MAIL_PASSWORD:kyydpmjoefdmacdh}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:87009973241-6k21kq749h6p4d5f61m39nbkr4lhbud3.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - profile
              - email

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Suraj@123}
