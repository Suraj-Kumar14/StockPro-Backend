  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

# JWT config
jwt:
  secret: ${JWT_SECRET:stockpro-local-jwt-secret-2026-change-this-before-production-8f4b2c9d7e1a6f3c}
  expiration: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    com.stockpro: DEBUG
  file:
    name: logs/auth-service.log

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  mail:
    from: ${MAIL_FROM:surajkr1122003@gmail.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
