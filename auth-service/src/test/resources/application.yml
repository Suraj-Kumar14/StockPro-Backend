app:
  jwt:
    secret: ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345

spring:
  boot:
    admin:
      client:
        enabled: false
  datasource:
    url: jdbc:h2:mem:authservice_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

eureka:
  client:
    enabled: false
