server:
  port: ${PORT:8084}

app:
  jwt:
    secret: ${JWT_SECRET:ThisIsASecretKeyForJwtTokenGenerationThatMustBeAtLeast32BytesLong12345}

product:
  service:
    name: ${PRODUCT_SERVICE_NAME:PRODUCT-SERVICE}

supplier:
  service:
    name: ${SUPPLIER_SERVICE_NAME:SUPPLIER-SERVICE}
    path: ${SUPPLIER_SERVICE_PATH:/api/v1/suppliers}

warehouse:
  service:
    name: ${WAREHOUSE_SERVICE_NAME:WAREHOUSE-SERVICE}

spring:
  application:
    name: PURCHASE-SERVICE

  datasource:
    url: jdbc:h2:mem:purchaseservice
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    operationsSorter: alpha
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
